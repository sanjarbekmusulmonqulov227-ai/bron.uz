name: Sayt (kunlik yangilanish)

# Publishes public/ to the gh-pages branch (GitHub Pages) with fresh daily tourism data:
# on every push to main that changes the site, every morning, and on demand from the Actions tab.
on:
  push:
    branches: [main]
    paths: ["public/**", "tools/fetch-daily.js", ".github/workflows/sayt.yml"]
  schedule:
    - cron: "15 2 * * *"   # 07:15 Toshkent vaqti
    - cron: "15 12 * * *"  # 17:15 Toshkent vaqti
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sayt
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Oldingi ma'lumot
        run: |
          mkdir -p public/data
          git fetch --depth=1 origin gh-pages && git show FETCH_HEAD:data/daily.json > public/data/daily.json || rm -f public/data/daily.json
      - name: Kunlik yangiliklar va statistika
        run: node tools/fetch-daily.js
      - name: GitHub Pages ga joylash
        run: |
          cd public
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Sayt: ${GITHUB_SHA::7}, ma'lumot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
